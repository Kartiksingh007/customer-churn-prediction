<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Customer Churn Predictor</h1>
            <p class="subtitle">RFM + Machine Learning + Flask</p>
            <p class="model">Selected model: <strong>{{ model_name }}</strong></p>

            <form id="churnForm">
                <div class="grid">
                    <label>
                        Recency (days)
                        <input type="number" name="recency" value="45" min="0" step="1" required>
                    </label>

                    <label>
                        Frequency (orders)
                        <input type="number" name="frequency" value="8" min="0" step="1" required>
                    </label>

                    <label>
                        Monetary (total spend)
                        <input type="number" name="monetary" value="4200" min="0" step="0.01" required>
                    </label>

                    <label>
                        Avg Order Value
                        <input type="number" name="avg_order_value" value="525" min="0" step="0.01" required>
                    </label>

                    <label>
                        Avg Quantity
                        <input type="number" name="avg_quantity" value="3.2" min="0" step="0.1" required>
                    </label>

                    <label>
                        Customer Lifetime (days)
                        <input type="number" name="customer_lifetime_days" value="180" min="0" step="1" required>
                    </label>
                </div>

                <button type="submit">Predict Churn</button>
            </form>

            <div id="result" class="result hidden"></div>
        </div>
    </div>

<script>
document.getElementById("churnForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const form = new FormData(event.target);
    const data = Object.fromEntries(form.entries());

    Object.keys(data).forEach(k => data[k] = Number(data[k]));

    const resultBox = document.getElementById("result");
    resultBox.classList.remove("hidden");
    resultBox.innerHTML = "Predicting...";

    try {
        const response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            resultBox.innerHTML = `<strong>Error:</strong> ${result.error}`;
            return;
        }

        const probability = (result.churn_probability * 100).toFixed(2);

        resultBox.innerHTML = `
            <h2>${result.prediction}</h2>
            <p>Churn probability: <strong>${probability}%</strong></p>
            <p>Risk level: <strong>${result.risk_level}</strong></p>
            <p>Model: ${result.model}</p>
        `;
    } catch (error) {
        resultBox.innerHTML = `<strong>Error:</strong> Could not connect to Flask server.`;
    }
});
</script>
</body>
</html>
